<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSFBPG-247343</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="shuttle-card">
        <h2>Campus Shuttle Fare and Boarding Pass Generator </h2>

        <table class="reference-table">
            <thead>
                <tr>
                    <th>Route</th>
                    <th>Fare per passenger (UGX)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>CAMPUS</strong> — Main campus</td>
                    <td>2,000</td>
                </tr>
                <tr>
                    <td><strong>CITY</strong> — City centre</td>
                    <td>3,500</td>
                </tr>
            </tbody>
        </table>

        <form id="shuttleForm">
            <div class="form-group">
                <label for="routeCode">Route</label>
                <input type="text" id="routeCode" required placeholder="Enter CAMPUS or CITY">
            </div>

            <div class="form-group">
                <label for="passengerCount">Number of Passengers</label>
                <input type="number" id="passengerCount" min="1" max="10" step="1" required placeholder="Enter number (1-10)">
            </div>

            <button type="submit">Generate Passes</button>
            <div id="shuttleResult"></div>
        </form>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
